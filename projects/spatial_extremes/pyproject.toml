[project]
name = "spatial_extremes"
version = "0.1.0"
description = "A step-by-step curriculum on spatial extremes: GEV block-maxima modelling with Gaussian-process latent fields, driven by real CDS in-situ land-station data over Iberia."
requires-python = ">=3.12"
# Three-layer stack:
#   xrtoolz-reader — data layer: the reader now lives in the xr_toolz monorepo
#              as the `xrtoolz-reader` distribution; the import namespace is
#              still `xrreader`, so `from xrreader import CDSInsituArchive` is
#              unchanged. [cds-insitu] pulls cdsapi + geopandas + pyarrow for
#              the GeoParquet cache.
#   xtremax  — extreme-value layer: block-maxima extraction, GEV distribution,
#              return levels (jax<0.12 ceiling co-installs with pyrox-gp/gaussx).
#   pyrox-gp — Gaussian-process layer (split out of the old single-package
#              pyrox): kernels, GPPrior, gp_factor/gp_sample, guides. `pyrox`
#              (the Equinox↔NumPyro core it builds on) is pinned explicitly
#              because the PyPI name "pyrox" is an unrelated project.
# NumPyro + optax drive SVI; cartopy renders the Iberian maps.
dependencies = [
    "xrtoolz-reader[cds-insitu]",
    "xtremax",
    "pyrox-gp",
    "pyrox",
    "numpyro>=0.21",
    "optax>=0.2",
    "cartopy>=0.22",
    # matplotlib is capped below 3.11: cartopy 0.25 declares `matplotlib>=3.6`
    # with no ceiling, but its gridliner still uses the `Locator.locs` attribute
    # that 3.11 deprecated. The visible symptom is not an error — a map drawn
    # with gridline labels *and* a colorbar computes a collapsed tight bounding
    # box, so `bbox_inches="tight"` (what the notebook inline backend uses)
    # crops the figure down to the bare colorbar and the map silently vanishes.
    # Lift this once cartopy ships a 3.11-compatible gridliner.
    "matplotlib<3.11",
    "pandas",
    "xarray",
    "loguru>=0.7",
]

[project.optional-dependencies]
notebooks = [
    "seaborn>=0.13",
    "ipython",
    "ipykernel>=6.29",
    "nbconvert>=7",
    "nbformat>=5",
    "mystmd>=1.3",
    "diffrax>=0.7.2",
]

# None of these are on PyPI — resolve from their public git repos so `uv sync`
# works on any checkout. pyrox and pyrox-gp are subpackages of the pyrox uv
# workspace; xrtoolz-reader is a subpackage of the xr_toolz monorepo.
[tool.uv.sources]
xtremax = { git = "https://github.com/jejjohnson/xtremax.git" }
pyrox-gp = { git = "https://github.com/jejjohnson/pyrox.git", subdirectory = "packages/pyrox-gp" }
pyrox = { git = "https://github.com/jejjohnson/pyrox.git", subdirectory = "packages/pyrox" }
xrtoolz-reader = { git = "https://github.com/jejjohnson/xr_toolz.git", subdirectory = "packages/xrtoolz-reader" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_extremes"]
