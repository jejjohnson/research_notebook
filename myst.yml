version: 1
project:
  title: Research Notebook
  authors:
    - name: Juan Emmanuel Johnson
  bibliography:
    - references.bib
    - methane.bib
    - projects/gaussianization/references.bib
  abbreviations:
    CKA: Centered Kernel Alignment
    HSIC: Hilbert--Schmidt Independence Criterion
    MI: Mutual Information
    TC: Total Correlation
    DP: Demographic Parity
    EO: Equalized Odds
    IPW: Inverse Propensity Weighting
    RBIG: Rotation-Based Iterative Gaussianization
    MINE: Mutual Information Neural Estimation
    NLL: Negative Log-Likelihood
    MLE: Maximum Likelihood Estimation
    VFAE: Variational Fair Autoencoder
    G-XCOV: Gaussianized Cross-Covariance (linear-CKA in Gaussianised space)
    G-MI: Gaussianized Mutual Information (closed-form Gaussian MI after Gaussianisation)
    G-TC: Gaussianized Total Correlation (full MI via a frozen joint flow)
    G-HSIC: Gaussianized HSIC
  numbering:
    enumerator: "(%s)"
    headings: false
    figure:
      enabled: true
    equation:
      enabled: true
    table:
      enabled: true
