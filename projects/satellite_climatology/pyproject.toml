[project]
name = "satellite_climatology"
version = "0.0.1"
description = "Prototype: global satellite coverage heatmap (v4 M4.0, Available layer)."
requires-python = ">=3.12"
dependencies = [
    # Discovery (prototype uses pystac-client directly; production swaps in geocatalog).
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    # Vector + gridding.
    "geopandas>=0.14",
    "shapely>=2",
    "rasterio>=1.3",
    # Arrays.
    "numpy>=1.26",
    "pandas>=2.2",
    "xarray>=2024.1",
    # Acquired layer: read an external PostGIS holdings table (creds via .env).
    "sqlalchemy>=2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "streamlit-folium>=0.22",
    "folium>=0.17",
    "matplotlib>=3.8",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satellite_climatology"]
