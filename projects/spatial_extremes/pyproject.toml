[project]
name = "spatial_extremes"
version = "0.1.0"
description = "A step-by-step curriculum on spatial extremes: GEV block-maxima modelling with Gaussian-process latent fields, driven by real CDS in-situ land-station data over Iberia."
requires-python = ">=3.12"
# Three-layer stack:
#   xrtoolz  — data layer: CDS in-situ land stations over Iberia ([cds-insitu]
#              pulls cdsapi + geopandas + pyarrow for the GeoParquet cache).
#   xtremax  — extreme-value layer: block-maxima extraction, GEV distribution,
#              return levels (jax<0.11 pin co-installs with pyrox/gaussx).
#   pyrox    — Gaussian-process layer: kernels, latent GP samplers, guides.
# NumPyro + optax drive SVI; cartopy renders the Iberian maps.
dependencies = [
    "xrtoolz[cds-insitu]",
    "xtremax",
    "pyrox",
    "numpyro>=0.21",
    "optax>=0.2",
    "cartopy>=0.22",
    "matplotlib",
    "pandas",
    "xarray",
    "loguru>=0.7",
]

[project.optional-dependencies]
notebooks = ["seaborn>=0.13", "ipython", "ipykernel>=6.29", "nbconvert>=7", "nbformat>=5", "mystmd>=1.3"]

# xtremax / pyrox / xrtoolz are not on PyPI yet — resolve from their public git
# repos so `uv sync` works on any checkout (not just this monorepo layout).
[tool.uv.sources]
xtremax = { git = "https://github.com/jejjohnson/xtremax.git" }
pyrox = { git = "https://github.com/jejjohnson/pyrox.git" }
xrtoolz = { git = "https://github.com/jejjohnson/xrtoolz.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_extremes"]
