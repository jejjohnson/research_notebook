[project]
name = "gaussian_processes"
version = "0.1.0"
description = "Gaussian-process tutorial notebooks — a structured curriculum from MVN foundations through structured operators, exact GPs, approximations, state-space, and applications."
requires-python = ">=3.12"
# Core runtime deps for the GP tutorial notebooks. `gaussx` provides the
# structured-operator + Gaussian primitives, `lineax` the operator base
# classes, `einx` the readable einsum-style linear-algebra notation used
# throughout the notebooks.
dependencies = [
    "gaussx>=0.0.10",
    "jax>=0.4",
    "jaxlib>=0.4",
    "lineax>=0.0.5",
    "equinox>=0.11",
    "einx>=0.3",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# Pulled in by the notebooks (plots, IPython display).
# `seaborn` is required by gaussian_quantities.ipynb for the joint+marginal
# KDE comparison of forward-vs-reverse KL fits.
notebooks = ["matplotlib", "seaborn>=0.13", "ipython", "ipykernel>=6.29"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_processes"]

# No pytest config: this subproject is notebook-only, no test suite yet.
